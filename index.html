<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Travel Data Collection Platform for Kerala - God's Own Country. Join NATPAC research while exploring Kerala's beauty." />
    <meta name="keywords" content="Kerala, NATPAC, travel, transportation, research, God's Own Country, trip tracking" />
    <meta name="theme-color" content="#000000" />
    
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>NATPAC Kerala - Smart Travel Platform | God's Own Country</title>

    <!-- 🔥 Force Black Button Styling -->
    <style>
      .download-buttons a {
        background: linear-gradient(145deg, #000000, #1a1a1a) !important;
        color: #ffffff !important;
        font-weight: bold !important;
        padding: 12px 28px !important;
        border-radius: 12px !important;
        text-decoration: none !important;
        display: inline-block !important;
        transition: all 0.3s ease-in-out !important;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4) !important;
        margin: 8px !important;
      }

      .download-buttons a:hover {
        background: linear-gradient(145deg, #1a1a1a, #000000) !important;
        transform: translateY(-3px) scale(1.03) !important;
        box-shadow: 0 6px 14px rgba(0,0,0,0.6) !important;
      }

      .download-buttons a:active {
        transform: translateY(1px) scale(0.97) !important;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/src/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
      
      // PWA install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // Show install button/banner
        const installBanner = document.createElement('div');
        installBanner.innerHTML = `
          <div style="position: fixed; bottom: 20px; left: 20px; right: 20px; 
                      background: rgba(0,0,0,0.85); color: white; 
                      padding: 16px; border-radius: 12px; 
                      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
                      z-index: 1000; display: flex; align-items: center; justify-content: space-between;">
            <div style="flex: 1;">
              <div style="font-weight: bold; margin-bottom: 4px;">📱 Install NATPAC Kerala</div>
              <div style="font-size: 14px; opacity: 0.9;">Add to home screen for better experience</div>
            </div>
            <button id="install-btn" style="background: linear-gradient(145deg, #000, #1a1a1a); border: none; 
                    color: white; padding: 8px 16px; border-radius: 8px; 
                    font-weight: bold; margin-left: 16px; cursor: pointer; transition: 0.3s;">Install</button>
            <button id="dismiss-btn" style="background: none; border: none; color: white; 
                    padding: 8px; margin-left: 8px; cursor: pointer; font-size: 18px;">×</button>
          </div>
        `;
        document.body.appendChild(installBanner);
        
        document.getElementById('install-btn').addEventListener('click', () => {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('User accepted the install prompt');
            }
            deferredPrompt = null;
            installBanner.remove();
          });
        });
        
        document.getElementById('dismiss-btn').addEventListener('click', () => {
          installBanner.remove();
        });
        
        // Auto-hide after 10 seconds
        setTimeout(() => {
          if (installBanner.parentNode) {
            installBanner.remove();
          }
        }, 10000);
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
